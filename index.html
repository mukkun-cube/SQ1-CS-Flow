<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12151a">
<title>Square-1 Shape Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12151a;
    --panel: #1c2129;
    --panel-2: #232933;
    --panel-3: #2a313c;
    --edge: #323a46;
    --gold: #e0a541;
    --gold-dim: #7a5f2c;
    --teal: #45b8ad;
    --teal-dim: #245a54;
    --coral: #e2604f;
    --coral-dim: #6b2e26;
    --ink: #eef1f4;
    --ink-dim: #939ba8;
    --ink-faint: #5c6472;
    --img-scale: 1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      repeating-linear-gradient(115deg, rgba(224,165,65,0.035) 0px, rgba(224,165,65,0.035) 1px, transparent 1px, transparent 64px),
      repeating-linear-gradient(25deg, rgba(69,184,173,0.035) 0px, rgba(69,184,173,0.035) 1px, transparent 1px, transparent 64px),
      var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans JP', sans-serif;
    display:flex;
    justify-content:center;
    padding:calc(env(safe-area-inset-top, 0px) + 24px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 40px) max(16px, env(safe-area-inset-left, 0px));
    -webkit-text-size-adjust:100%;
  }
  button{ touch-action:manipulation; -webkit-user-select:none; user-select:none; font-family:inherit; }
  .wrap{ width:100%; max-width:480px; }

  @media (min-width: 620px){
    .wrap{ max-width:600px; }
    :root{ --img-scale: 1.2; }
    body{ padding-top:40px; }
    .brand .mark{ font-size:25px; }
    .current-shape{ font-size:34px; }
    .choice{ font-size:15.5px; padding:16px 12px; }
    .card{ padding:30px 28px 26px; }
  }

  @media (min-width: 900px){
    .wrap{ max-width:720px; }
    :root{ --img-scale: 1.4; }
    body{ padding-top:56px; }
    .brand .mark{ font-size:28px; }
    .brand .sub{ font-size:13px; }
    .current-shape{ font-size:38px; }
    .choice{ font-size:16.5px; padding:18px 14px; }
    .card{ padding:36px 34px 30px; }
    .prompt{ font-size:14px; }
    .track .seg{ height:6px; }
  }

  @media (min-width: 1280px){
    .wrap{ max-width:820px; }
    :root{ --img-scale: 1.55; }
  }

  header{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:14px; gap:10px; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .mark{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:0.02em; }
  .brand .mark span{ color:var(--gold); }
  .brand .sub{ font-size:12px; color:var(--ink-dim); }
  .stat-pair{ display:flex; gap:14px; flex-shrink:0; }
  .stat{ text-align:right; }
  .stat .n{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; line-height:1; }
  .stat .l{ font-size:10px; color:var(--ink-faint); margin-top:3px; white-space:nowrap; }
  .stat.acc .n{ color:var(--teal); }
  .stat.streak .n{ color:var(--gold); }

  .control-row{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; flex-wrap:wrap;
  }
  .mode-toggle, .tabbar{
    display:flex; border:1px solid var(--edge); border-radius:20px; overflow:hidden;
  }
  .mode-toggle button, .tabbar button{
    background:transparent; border:none; color:var(--ink-dim);
    font-size:12px; font-weight:500;
    padding:7px 16px; cursor:pointer; transition:background .15s,color .15s; white-space:nowrap;
  }
  .mode-toggle button.active, .tabbar button.active{ background:var(--gold); color:#1a1406; font-weight:700; }
  .mode-toggle button:not(.active):hover, .tabbar button:not(.active):hover{ color:var(--ink); }

  .tabbar{ margin-bottom:16px; width:100%; }
  .tabbar button{ flex:1; padding:10px 8px; font-size:13px; border-radius:0; }

  /* トレーナー｜学習, アプリ｜パズル, and 成形経路｜チェック｜スクランブル
     all match the 状態 toggle's height/font */
  #mainTabBar button, #trainerSubTabBar button, #studySubTabBar button{
    padding:7px 12px; font-size:12px; font-family:'Space Grotesk',sans-serif;
  }

  .filters-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .maxmoves-group{ display:flex; align-items:center; gap:6px; }
  .filters-row .maxmoves-toggle button{ padding:7px 8px; }

  .maxmoves-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .progress-row{ text-align:right; margin-bottom:6px; }
  .progress-row span{
    font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:600;
    color:var(--ink-faint); letter-spacing:0.02em;
  }
  .maxmoves-label{ font-size:11px; color:var(--ink-faint); white-space:nowrap; }
  .maxmoves-toggle{ display:flex; border:1px solid var(--edge); border-radius:20px; overflow:hidden; }
  .maxmoves-toggle button{
    background:transparent; border:none; color:var(--ink-dim); font-size:12px; font-weight:600;
    padding:7px 12px; cursor:pointer; font-family:'Space Grotesk',sans-serif;
  }
  .maxmoves-toggle button.active{ background:var(--teal); color:#062421; }
  .maxmoves-toggle button:not(.active):hover{ color:var(--ink); }

  .track{
    display:flex; gap:5px; margin-bottom:16px;
  }
  .track .seg{
    flex:1; height:5px; border-radius:1px;
    background:var(--edge);
    position:relative; overflow:hidden;
  }
  .track .seg.done{ background:var(--teal-dim); }
  .track .seg.done::after{ content:''; position:absolute; inset:0; background:var(--teal); }
  .track .seg.miss.done::after{ background:var(--coral); }
  .track .seg.now{ background:var(--gold-dim); }
  .track .seg.now::after{ content:''; position:absolute; inset:0; background:var(--gold); animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .card{
    background:var(--panel);
    border:1px solid var(--edge);
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
    padding:26px 24px 22px;
    position:relative;
  }
  .card::before{
    content:''; position:absolute; top:0; right:0; width:22px; height:22px;
    border-left:1px solid var(--edge); border-bottom:1px solid var(--edge);
    clip-path: polygon(100% 0, 100% 100%, 0 0);
    background:var(--panel-2);
  }

  .row-label{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .row-label .k{ font-size:11px; color:var(--ink-faint); letter-spacing:0.04em; }
  .moves-badge{
    font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:600;
    color:var(--gold); border:1px solid var(--gold-dim); padding:2px 9px;
    border-radius:2px; background:rgba(224,165,65,0.08);
  }
  .star-badge{
    font-size:11px; color:var(--coral); border:1px solid var(--coral-dim);
    padding:2px 8px; border-radius:2px; background:rgba(226,96,79,0.08); margin-left:6px;
  }

  .current-shape-wrap{
    margin:2px 0 22px; padding-bottom:18px; border-bottom:1px dashed var(--edge);
  }
  .current-shape{
    font-family:'Space Grotesk',sans-serif;
    font-size:30px; font-weight:600; line-height:1.15;
  }
  .current-shape .slash{ color:var(--ink-faint); font-weight:400; margin:0 2px; }

  .shape-visual{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:nowrap; min-width:0; }
  .shape-chip{
    background:var(--panel-3); border:1px solid var(--edge); border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    padding:6px; min-width:0; flex-shrink:1;
  }
  .shape-chip img{ display:block; max-width:100%; height:auto; }
  .visual-sep{ color:var(--ink-faint); font-size:20px; font-weight:300; }
  .visual-label{ text-align:center; font-size:12.5px; color:var(--ink-dim); margin-top:10px; font-family:'IBM Plex Sans JP',sans-serif; }
  .visual-label b{ color:var(--ink); font-weight:600; }

  .prompt{ font-size:13px; color:var(--ink-dim); margin-bottom:12px; }

  .choices{
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px;
  }
  .choice{
    background:var(--panel-2);
    border:1px solid var(--edge);
    color:var(--ink);
    font-size:14.5px; font-weight:500;
    padding:14px 10px;
    border-radius:3px;
    cursor:pointer;
    text-align:center;
    transition:border-color .15s, background .15s, transform .1s;
    line-height:1.35;
    min-width:0; overflow:hidden;
  }
  .choice:hover{ border-color:var(--ink-faint); }
  .choice:active{ transform:scale(0.98); }
  .choice.correct{ background:rgba(69,184,173,0.14); border-color:var(--teal); color:var(--teal); }
  .choice.wrong{ background:rgba(226,96,79,0.14); border-color:var(--coral); color:var(--coral); }
  .choice.disabled{ pointer-events:none; opacity:0.55; }
  .choice.disabled.correct, .choice.disabled.wrong{ opacity:1; }

  .choice .shape-chip{ background:var(--panel-3); }
  .choice.correct .shape-chip{ border-color:var(--teal); }
  .choice.wrong .shape-chip{ border-color:var(--coral); }
  .choice .visual-label{ margin-top:8px; font-size:11.5px; }
  .choice.correct .visual-label b{ color:var(--teal); }
  .choice.wrong .visual-label b{ color:var(--coral); }

  .info-step{
    background:var(--panel-2); border:1px solid var(--edge); border-radius:3px;
    padding:16px; font-size:13.5px; color:var(--ink-dim); line-height:1.6; text-align:center;
  }
  .info-step b{ color:var(--teal); font-weight:600; }
  .info-lead{ margin-bottom:12px; }
  .info-trail{ margin-top:12px; font-weight:600; color:var(--ink); }
  .tail-chain{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .tail-node{ display:flex; flex-direction:column; align-items:center; }
  .tail-arrow{ color:var(--ink-faint); font-size:14px; line-height:1; margin:2px 0; }

  .next-btn{
    margin-top:18px; width:100%;
    background:var(--gold); color:#1a1406;
    border:none; padding:14px; font-size:14px; font-weight:700;
    font-family:'Space Grotesk',sans-serif; letter-spacing:0.01em;
    cursor:pointer; border-radius:2px;
  }
  .next-btn:hover{ background:#eeb75f; }
  .next-btn.ghost{
    background:transparent; color:var(--ink-dim); border:1px solid var(--edge);
  }
  .next-btn.ghost:hover{ background:transparent; border-color:var(--ink-faint); color:var(--ink); }

  .complete{
    text-align:center; padding:6px 0 4px;
  }
  .complete .big{ font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700; color:var(--teal); margin-bottom:6px; }
  .complete .desc{ font-size:13px; color:var(--ink-dim); margin-bottom:20px; }
  .complete .score{ font-size:13px; color:var(--ink); margin-bottom:20px; }
  .complete .score b{ color:var(--gold); font-family:'Space Grotesk',sans-serif; font-size:16px; }
  .cycle-choices{ display:flex; flex-direction:column; gap:10px; }
  .cycle-choices .next-btn{ margin-top:0; }

  .foot-panel{
    margin-top:16px; display:flex; gap:10px;
  }
  .mini-btn{
    flex:1; background:transparent; border:1px solid var(--edge); color:var(--ink-dim);
    font-size:12px; padding:10px; border-radius:2px; cursor:pointer;
  }
  .mini-btn:hover{ color:var(--ink); border-color:var(--ink-faint); }

  .weak-panel{
    margin-top:14px; background:var(--panel); border:1px solid var(--edge); padding:16px 18px;
    display:none;
  }
  .weak-panel.open{ display:block; }
  .weak-panel h3{ font-family:'Space Grotesk',sans-serif; font-size:13px; margin:0 0 10px; color:var(--ink-dim); font-weight:600; letter-spacing:0.03em; }
  .weak-row{ display:flex; align-items:center; justify-content:space-between; font-size:13px; padding:8px 0; border-bottom:1px solid var(--edge); gap:10px; }
  .weak-row:last-child{ border-bottom:none; }
  .weak-row .name{ color:var(--ink); display:flex; align-items:center; gap:8px; }
  .weak-row .shape-chip{ padding:4px; }
  .weak-row .rate{ color:var(--coral); font-family:'Space Grotesk',sans-serif; font-weight:600; white-space:nowrap; }
  .weak-empty{ font-size:12.5px; color:var(--ink-faint); }

  .note{ margin-top:16px; font-size:11px; color:var(--ink-faint); text-align:center; line-height:1.6; }

  /* trace view */
  .trace-hint{ font-size:12.5px; color:var(--ink-dim); margin-bottom:14px; text-align:center; }
  .trace-shape-list{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .trace-shape-btn{
    background:var(--panel-2); border:1px solid var(--edge); border-radius:4px;
    color:var(--ink); cursor:pointer; text-align:center; padding:12px 8px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    min-width:0; overflow:hidden;
  }
  .trace-shape-btn:hover{ border-color:var(--ink-faint); }
  .trace-shape-btn:active{ transform:scale(0.98); }
  .trace-shape-btn .mv-tag{
    font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:600; color:var(--gold);
    display:block; margin-top:3px;
  }
  .trace-shape-btn .label{ font-size:12.5px; line-height:1.3; }
  .trace-group{ margin-bottom:18px; }
  .trace-group-title{
    font-family:'Space Grotesk',sans-serif; font-size:11px; color:var(--ink-faint);
    letter-spacing:0.04em; margin-bottom:8px; padding-left:2px;
  }
  .back-btn{ margin-bottom:14px; width:100%; flex:none; }
  .trace-card{
    background:var(--panel); border:1px solid var(--edge); border-radius:6px; padding:18px 16px;
  }
  .trace-seq{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .trace-node{ display:flex; align-items:center; gap:10px; width:100%; padding:6px 0; }
  .trace-node .mv{
    font-family:'Space Grotesk',sans-serif; font-size:10.5px; color:var(--ink-faint);
    width:34px; text-align:right; flex-shrink:0;
  }
  .trace-node .content{ flex:1; display:flex; align-items:center; gap:10px; min-width:0; }
  .trace-node .content .shape-chip{ padding:5px; }
  .trace-node .content .txt{ font-size:13px; color:var(--ink); }
  .trace-node.final .txt, .trace-node.final .mv{ color:var(--teal); font-weight:700; }
  .trace-node.final .shape-chip{ border-color:var(--teal); }
  .trace-arrow-row{ color:var(--ink-faint); font-size:12px; padding-left:34px; align-self:flex-start; margin:2px 0; }
  .branch-wrap{ width:100%; display:flex; flex-direction:column; gap:14px; }
  .branch-col{ border-left:2px dashed var(--edge); padding-left:12px; margin-left:34px; }
  .branch-col .branch-label{ font-size:11px; color:var(--ink-faint); margin-bottom:4px; }
  .trace-empty{ font-size:12.5px; color:var(--ink-faint); text-align:center; padding:20px 0; }

  .view{ display:none; }
  .view.active{ display:block; }

  /* study / trainer sub-panels */
  .subtabbar{ margin-bottom:14px; }
  .study-panel, .trainer-panel{ display:none; }
  .study-panel.active, .trainer-panel.active{ display:block; }
  .study-empty{
    text-align:center; color:var(--ink-faint); font-size:13px;
    padding:40px 10px; background:var(--panel); border:1px solid var(--edge); border-radius:6px;
  }

  /* mastery badge */
  .mastery-row{ display:flex; justify-content:flex-end; margin-bottom:10px; }
  .mastery-badge{
    font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:700;
    padding:6px 14px; border-radius:20px; cursor:pointer; border:1px solid var(--edge);
    background:transparent;
  }
  .mastery-badge.known{ background:rgba(69,184,173,0.14); border-color:var(--teal); color:var(--teal); }
  .mastery-badge.unknown{ background:rgba(226,96,79,0.10); border-color:var(--coral-dim); color:var(--coral); }

  /* scramble screen */
  .scramble-info{
    background:var(--panel); border:1px solid var(--edge); border-radius:6px;
    padding:22px 18px; text-align:center; margin-bottom:16px;
  }
  .scramble-pattern{
    font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; color:var(--ink);
    margin-bottom:18px;
  }
  .scramble-text{
    font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--gold);
    white-space:nowrap; overflow:hidden;
    font-size:clamp(14px, 7.2vw, 40px);
    line-height:1.3;
  }
  .scramble-switch{
    margin-top:14px; background:transparent; border:1px solid var(--edge); color:var(--ink-dim);
    font-size:11.5px; padding:6px 14px; border-radius:20px; cursor:pointer;
  }
  .scramble-switch:hover{ color:var(--ink); border-color:var(--ink-faint); }

  /* timer */
  .timer-widget{
    background:var(--panel-2); border:2px solid var(--edge); border-radius:10px;
    padding:34px 18px; text-align:center; cursor:pointer; user-select:none;
    transition:background .12s, border-color .12s;
  }
  .timer-widget.green{ background:rgba(69,184,173,0.18); border-color:var(--teal); }
  .timer-widget.running{ background:rgba(224,165,65,0.14); border-color:var(--gold); }
  .timer-display{
    font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--ink);
    font-size:clamp(40px, 16vw, 88px); line-height:1;
  }
  .timer-hint{ margin-top:10px; font-size:12.5px; color:var(--ink-faint); }

  .hidden{ display:none !important; }

  /* When a scramble/timer screen is active, stretch the timer box down to
     the bottom of the viewport (number/hint keep their normal top position
     and size -- only the frame grows) to make tapping to stop easier. */
  body.page-fill{ height:100dvh; overflow-y:auto; }
  body.page-fill .wrap{ display:flex; flex-direction:column; min-height:100%; }
  body.page-fill .view.active{ flex:1; display:flex; flex-direction:column; min-height:0; }
  body.page-fill .study-panel.active,
  body.page-fill .trainer-panel.active{ flex:1; display:flex; flex-direction:column; min-height:0; }
  body.page-fill #scrambleContentWrap,
  body.page-fill #puzzleContentWrap{ flex:1; display:flex; flex-direction:column; min-height:0; }
  body.page-fill .timer-widget{ flex:1; min-height:120px; }
  .check-complete-msg{
    text-align:center; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:16px; color:var(--teal);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="mark">Square<span>-1</span>&nbsp;Cube&nbsp;Shape</div>
    </div>
  </header>

  <div class="control-row">
    <div class="tabbar" id="mainTabBar">
      <button data-main-tab="trainer">トレーナー</button>
      <button data-main-tab="study" class="active">学習</button>
    </div>
  </div>

  <!-- ============ 学習 ============ -->
  <div class="view active" id="view-study">

    <div class="control-row">
      <div class="tabbar subtabbar" id="studySubTabBar">
        <button data-study-tab="path" class="active">成形経路</button>
        <button data-study-tab="check">チェック</button>
        <button data-study-tab="scramble">スクランブル</button>
      </div>
    </div>

    <button class="mini-btn back-btn" id="studyBackBtn">← 一覧に戻る</button>

    <div id="studySharedList">
      <div id="traceShapeList"></div>
    </div>

    <div class="study-panel active" id="study-path">
      <div id="tracePathWrap">
        <div id="tracePathMastery"></div>
        <div class="trace-card">
          <div id="tracePathContent"></div>
        </div>
      </div>
    </div>

    <div class="study-panel" id="study-check">
      <div id="checkContentWrap">
        <div id="checkMastery"></div>
        <div class="track" id="checkTrack"></div>
        <div class="card" id="checkCard"></div>
      </div>
    </div>

    <div class="study-panel" id="study-scramble">
      <div id="scrambleContentWrap">
        <div id="studyScrambleMastery"></div>
        <div class="scramble-info">
          <div class="scramble-pattern" id="studyPatternName"></div>
          <div class="scramble-text" id="studyScrambleText"></div>
          <button class="scramble-switch" id="studyScrambleSwitch" style="display:none;"></button>
        </div>
        <div class="timer-widget" id="studyTimerBtn" tabindex="0">
          <div class="timer-display" id="studyTimerDisplay">0.00</div>
          <div class="timer-hint" id="studyTimerHint">長押ししてスタート</div>
        </div>
      </div>
    </div>
  </div>

const byMove = {};
RAW_CHAINS.forEach(([flag, chain]) => {
  chain.forEach(([mv, shape]) => {
    if(!byMove[mv]) byMove[mv] = new Set();
    byMove[mv].add(shape);
  });
});
const ALL_SHAPES = Array.from(new Set(RAW_CHAINS.flatMap(([f,c]) => c.map(x => x[1]))));

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function shapeSlash(s){
  const parts = s.split('/');
  if(parts.length === 2){
    return `${parts[0]}<span class="slash">/</span>${parts[1]}`;
  }
  return s;
}

function renderShapeIcons(shapeStr, size){
  const parts = shapeStr.split('/');
  const chips = parts.map(p => {
    const src = imgSrcForTerm(p);
    if(!src){
      return `<div class="shape-chip"><span>${p}</span></div>`;
    }
    return `<div class="shape-chip"><img src="${src}" alt="${p}" style="width:calc(${size}px * var(--img-scale, 1))"></div>`;
  });
  return `<div class="shape-visual">${chips.join('<span class="visual-sep">/</span>')}</div>`;
}

function imgSrcForTerm(term){
  const file = TERM_TO_FILE[term];
  return file ? FILE_IMAGES[file] : null;
}

// Renders a shape as either text or an image-pair, depending on the given
// mode (falls back to the global toggle mode when not specified).
function renderShapeVisual(shapeStr, opts){
  opts = opts || {};
  const size = opts.size || 48;
  const showLabel = !!opts.showLabel;
  const labelClass = opts.labelClass || '';
  const effectiveMode = opts.mode || mode;

  if(effectiveMode === 'text'){
    return `<div class="current-shape">${shapeSlash(shapeStr)}</div>`;
  }

  const parts = shapeStr.split('/');
  const chips = parts.map(p => {
    const src = imgSrcForTerm(p);
    if(!src){
      return `<div class="shape-chip"><span>${p}</span></div>`;
    }
    return `<div class="shape-chip"><img src="${src}" alt="${p}" style="width:calc(${size}px * var(--img-scale, 1))"></div>`;
  });
  let html = `<div class="shape-visual">${chips.join('<span class="visual-sep">/</span>')}</div>`;
  if(showLabel){
    html += `<div class="visual-label ${labelClass}">${shapeSlash(shapeStr)}</div>`;
  }
  return html;
}

// ---- mastery (既修/未修) state, shared across all screens ----
let mastery = {}; // shape -> 'known' | 'unknown' (absent = unknown)
let statusFilter = 'all'; // 'all' | 'known' | 'unknown' -- used by トレーナー filters
function isKnown(shape){ return mastery[shape] === 'known'; }
function matchesStatus(shape){
  if(statusFilter === 'known') return isKnown(shape);
  if(statusFilter === 'unknown') return !isKnown(shape);
  return true;
}
function setMastery(shape, status){
  mastery[shape] = status;
  saveMastery();
}
function toggleMastery(shape){
  setMastery(shape, isKnown(shape) ? 'unknown' : 'known');
}
// Renders a small tappable badge reflecting the current mastery of `shape`.
// `onChange` is called after the state is toggled, so the caller can re-render.
function renderMasteryBadge(shape, onChange){
  const known = isKnown(shape);
  const badge = document.createElement('button');
  badge.className = 'mastery-badge ' + (known ? 'known' : 'unknown');
  badge.textContent = known ? '既修' : '未修';
  badge.onclick = () => {
    toggleMastery(shape);
    if(onChange) onChange();
  };
  const row = document.createElement('div');
  row.className = 'mastery-row';
  row.appendChild(badge);
  return row;
}

// ---- candidate (question) generation ----
// A "candidate" is a contiguous tail-slice of a registered chain, starting at
// any node whose move-count is >=3 (0/1/2-move starts are excluded per spec).
// key = the exact sequence of shapes presented, used for repeat-avoidance,
// so two different source chains that happen to share a suffix collide on purpose.
function buildCandidates(moveSet, statusFilterArg){
  const byKey = new Map();
  RAW_CHAINS.forEach(([flag, chain], chainIdx) => {
    for(let i=0;i<chain.length;i++){
      const startMove = chain[i][0];
      if(startMove < 3) break; // moves strictly decrease along the chain
      if(!moveSet.has(startMove)) continue;
      const startShape = chain[i][1];
      if(statusFilterArg && statusFilterArg !== 'all'){
        const known = isKnown(startShape);
        if(statusFilterArg === 'known' && !known) continue;
        if(statusFilterArg === 'unknown' && known) continue;
      }
      const sub = chain.slice(i);
      const key = sub.map(x => x[1]).join('>');
      // Several source chains often converge onto the identical tail sequence;
      // dedupe by key so a "lap" means every distinct pattern exactly once.
      if(!byKey.has(key)){
        byKey.set(key, { chainIdx, startIndex:i, startMove, flag, chain: sub, key });
      }
    }
  });
  return Array.from(byKey.values());
}

let selectedMoves = new Set([3,4,5,6,7]);
let candidates = buildCandidates(selectedMoves, statusFilter);
let cycleQueue = []; // shuffled remaining candidates for the current lap; empty = lap finished
let missedKeys = new Set(); // candidate keys that were answered wrong at least once this lap/session

// ---- lap progress display ("current card / total patterns") ----
// A "pattern" is a distinct starting shape; branches/alternates that share the
// same starting shape must not inflate the total, per spec.
let lapTotalPatterns = 0;
let lapSeenPatterns = new Set();

function setLapPool(pool){
  lapTotalPatterns = new Set(pool.map(c => c.chain[0][1])).size;
  lapSeenPatterns = new Set();
  renderCardProgress();
}
function renderCardProgress(){
  const el = document.getElementById('cardProgress');
  if(!el) return;
  el.textContent = lapTotalPatterns > 0 ? `${lapSeenPatterns.size} / ${lapTotalPatterns}` : '';
}

function rebuildCandidates(){
  candidates = buildCandidates(selectedMoves, statusFilter);
  cycleQueue = shuffle(candidates); // setting changed -> start a fresh lap
  setLapPool(candidates);
}

// Returns the next candidate for this lap, or null if the lap just finished
// (every selected pattern has been asked once) so the caller can offer a choice.
function pickCandidate(){
  if(cycleQueue.length === 0) return null;
  return cycleQueue.pop();
}

// ---- storage ----
// Prefer Claude's artifact-only window.storage API when present (claude.ai);
// otherwise fall back to plain localStorage so the app also works standalone
// (e.g. hosted on Netlify / added to the iPhone home screen).
const hasClaudeStorage = typeof window !== 'undefined' && !!window.storage;

async function storageGet(key){
  if(hasClaudeStorage){
    try{
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }catch(e){ return null; }
  }
  try{ return window.localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasClaudeStorage){
    try{ await window.storage.set(key, value, false); }catch(e){}
    return;
  }
  try{ window.localStorage.setItem(key, value); }catch(e){}
}

const MISSED_KEY = 'sq1-shape-missed-v3';

async function loadSelectedMoves(){
  const v = await storageGet(SELECTED_MOVES_KEY);
  if(v){
    const parsed = v.split(',').map(n => parseInt(n,10)).filter(n => n>=3 && n<=7);
    if(parsed.length > 0) selectedMoves = new Set(parsed);
  }

  await storageSet(SELECTED_MOVES_KEY, Array.from(selectedMoves).join(','));

  const v = await storageGet(MISSED_KEY);
  if(v){ try{ missedKeys = new Set(JSON.parse(v)); }catch(e){} }

  await storageSet(MISSED_KEY, JSON.stringify(Array.from(missedKeys)));

  const v = await storageGet(MASTERY_KEY);
  if(v){ try{ mastery = JSON.parse(v); }catch(e){} }
}
async function saveMastery(){
  await storageSet(MASTERY_KEY, JSON.stringify(mastery));
}
async function loadStatusFilter(){
  const v = await storageGet(STATUS_KEY);
  if(v === 'known' || v === 'unknown' || v === 'all') statusFilter = v;
  syncStatusButtons();

async function saveStatusFilter(){
  await storageSet(STATUS_KEY, statusFilter);

function syncStatusButtons(){
  document.querySelectorAll('#statusToggle button').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-status') === statusFilter);

function syncModeButtons(){
  document.querySelectorAll('#modeToggle button').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-mode') === mode);

function syncMaxMovesButtons(){
  document.querySelectorAll('#maxMovesToggle button').forEach(b => {
    b.classList.toggle('active', selectedMoves.has(parseInt(b.getAttribute('data-mm'),10)));

// ---- session state ----
let current = null;
let onCycleCompleteScreen = false;

function pickChain(){
  const cand = pickCandidate();
  if(!cand){
    onCycleCompleteScreen = true;
    renderCycleComplete();
    return;
  }
  onCycleCompleteScreen = false;
  lapSeenPatterns.add(cand.chain[0][1]);
  renderCardProgress();
  current = {
    key: cand.key,
    flag: cand.flag,
    chain: cand.chain,
    startMove: cand.startMove,
    stepIndex: 0,
    hadMistake: false
  };
  renderTrack();
  renderStep();
}

function startFreshCycle(){
  cycleQueue = shuffle(candidates.slice());
  setLapPool(candidates);
  pickChain();
}

function startReviewCycle(){
  const missedCandidates = candidates.filter(c => missedKeys.has(c.key));
  cycleQueue = shuffle(missedCandidates);
  setLapPool(missedCandidates);
  pickChain();
}

function renderCycleComplete(){
  const card = document.getElementById('card');
  const hasMissed = missedKeys.size > 0;
  card.innerHTML = `
    <div class="complete">
      <div class="big">${hasMissed ? '一周しました！' : '全問正解でした！'}</div>
      <div class="desc">${hasMissed ? `選択中の手数の全パターンを出題しました。（復習対象 ${missedKeys.size} 問）` : '選択中の手数の全パターンに正解しました。'}</div>
      <div class="cycle-choices">
        ${hasMissed ? '<button class="next-btn" id="reviewCycleBtn">復習する</button>' : ''}
        <button class="next-btn ${hasMissed ? 'ghost' : ''}" id="retryCycleBtn">もう一度やる</button>
      </div>
    </div>
  `;
  const reviewBtn = document.getElementById('reviewCycleBtn');
  if(reviewBtn) reviewBtn.onclick = startReviewCycle;
  document.getElementById('retryCycleBtn').onclick = startFreshCycle;
  document.getElementById('track').innerHTML = '';
}

function renderTrack(){
  const track = document.getElementById('track');
  track.innerHTML = '';
  current.chain.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'seg';
    if(i < current.stepIndex){
      seg.classList.add('done');
      if(current.missedSteps && current.missedSteps[i]) seg.classList.add('miss');
    }
    if(i === current.stepIndex) seg.classList.add('now');
    track.appendChild(seg);
  });
}

// Whether answering the transition into `nextMove` is the last quiz step of
// this card (moves 0/1 are never quizzed, so once we'd land there we're done).
function isFinalQuizTarget(chain, stepIndex){
  const after = chain[stepIndex+2];
  return !after || after[0] <= 1;
}

function buildChoices(curShape, correctShape, toMove, startMove){
  const pool = new Set();
  pool.add(correctShape);
  // Shapes that could ALSO validly follow curShape (branching data) must never
  // be offered as a "wrong" choice.
  const alternates = new Set(Array.from(nextsMap[curShape] || []).filter(s => s && s !== correctShape));

  if(startMove === 3){
    // Only one quiz step ever exists here (target = move 2), and that pool
    // has no branching ambiguity in the dataset, so the old same-move pool is safe.
    const sameMove = Array.from(byMove[toMove] || []).filter(s => s !== correctShape);
    shuffle(sameMove).forEach(s => { if(pool.size < 4) pool.add(s); });
  } else {
    // Never offer a shape with the same or fewer remaining moves than the
    // correct answer -- that's exactly where a true alternate could hide.
    const higherPool = [];
    for(let mv = toMove+1; mv <= 7; mv++){
      (byMove[mv] || new Set()).forEach(s => higherPool.push(s));
    }
    shuffle(higherPool).forEach(s => { if(pool.size < 4 && s !== correctShape) pool.add(s); });
    if(pool.size < 4){
      const sameMoveSafe = Array.from(byMove[toMove] || []).filter(s => s !== correctShape && !alternates.has(s));
      shuffle(sameMoveSafe).forEach(s => { if(pool.size < 4) pool.add(s); });
    }
  }
  if(pool.size < 4){
    shuffle(ALL_SHAPES).forEach(s => { if(pool.size < 4 && !alternates.has(s)) pool.add(s); });
  }
  return shuffle(Array.from(pool));
}

function goToNextStepOrCard(stepIndex, chain){
  if(isFinalQuizTarget(chain, stepIndex)){
    showCompletionPath(stepIndex, chain);
  } else {
    current.stepIndex++;
    renderTrack();
    renderStep();
  }
}

// After the last quiz step of a card is answered (correct or wrong), reveal
// the remaining (always-deterministic) shapes down to Square/Square, and
// require an explicit tap on "次のカードへ" before moving on.
function showCompletionPath(stepIndex, chain){
  const [curMove, curShape] = chain[stepIndex+1];
  const tail = chain.slice(stepIndex+2);
  current.stepIndex = chain.length - 1;
  renderTrack();

  const card = document.getElementById('card');
  const tailHtml = tail.map((node, idx) => {
    const [, shape] = node;
    const isFinal = idx === tail.length - 1;
    const visual = renderShapeVisual(shape, {size:40, showLabel:true, mode:'image'});
    const arrow = isFinal ? '' : '<div class="tail-arrow">↓</div>';
    return `<div class="tail-node">${visual}</div>${arrow}`;
  }).join('');

  card.innerHTML = `
    <div class="row-label">
      <span class="k">現在の形</span>
      <span class="moves-badge">残り ${curMove} 手</span>
    </div>
    <div class="current-shape-wrap">${renderShapeVisual(curShape, {size:52, showLabel:true, mode:'image'})}</div>
    <div class="info-step">
      <div class="tail-chain">${tailHtml}</div>
    </div>
    <button class="next-btn" id="nextCardBtn">次のカードへ</button>
  `;
  document.getElementById('nextCardBtn').onclick = finishCard;
}

function finishCard(){
  if(current.hadMistake) missedKeys.add(current.key);
  else missedKeys.delete(current.key);
  saveMissed();
  pickChain();
}

function renderStep(){
  const card = document.getElementById('card');
  const { chain, stepIndex } = current;
  const [curMove, curShape] = chain[stepIndex];
  const [nextMove, nextShape] = chain[stepIndex+1];

  let html = `
    <div class="row-label">
      <span class="k">現在の形</span>
      <span class="moves-badge">残り ${curMove} 手</span>
    </div>
    <div class="current-shape-wrap">${renderShapeVisual(curShape, {size:52, showLabel:true, mode:'image'})}</div>
    <div class="prompt">次の形は？（残り ${nextMove} 手）</div>
    <div class="choices" id="choicesBox"></div>
  `;
  card.innerHTML = html;

  const choices = buildChoices(curShape, nextShape, nextMove, current.startMove);
  const choicesBox = document.getElementById('choicesBox');
  choicesBox.innerHTML = choices.map(c => {
    const body = renderShapeVisual(c, {size:40, showLabel:false, mode:'image'});
    return `<button class="choice" data-shape="${c.replace(/"/g,'&quot;')}">${body}</button>`;
  }).join('');

  const buttons = card.querySelectorAll('.choice');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const picked = btn.getAttribute('data-shape');
      const correct = picked === nextShape;
      buttons.forEach(b => {
        b.classList.add('disabled');
        const isThisCorrect = b.getAttribute('data-shape') === nextShape;
        if(isThisCorrect) b.classList.add('correct');
        else if(b === btn) b.classList.add('wrong');
        if(isThisCorrect || b === btn){
          const shapeName = b.getAttribute('data-shape');
          const label = document.createElement('div');
          label.className = 'visual-label';
          label.innerHTML = `<b>${shapeSlash(shapeName)}</b>`;
          b.appendChild(label);
        }
      });

      if(!correct){
        current.hadMistake = true;
        if(!current.missedSteps) current.missedSteps = {};
        current.missedSteps[stepIndex] = true;
      }

      if(correct){
        // Move on automatically -- no button needed on a correct answer.
        setTimeout(() => goToNextStepOrCard(stepIndex, chain), 550);
      } else {
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn';
        nextBtn.textContent = '次へ進む';
        nextBtn.onclick = () => goToNextStepOrCard(stepIndex, chain);
        card.appendChild(nextBtn);
      }
    }, { once: true });
  });
}

function renderWeakList(){
  const list = document.getElementById('weakList');
  const entries = candidates.filter(c => missedKeys.has(c.key));

  if(entries.length === 0){
    list.innerHTML = '<div class="weak-empty">今のところ復習対象はありません。</div>';
    return;
  }
  list.innerHTML = entries.map(c => {
    const startShape = c.chain[0][1];
    const visual = renderShapeIcons(startShape, 30);
    return `
      <button class="trace-shape-btn review-item" data-key="${c.key.replace(/"/g,'&quot;')}">
        ${visual}
        <span class="label">${shapeSlash(startShape)}<span class="mv-tag">残り${c.startMove}手</span></span>
      </button>
    `;
  }).join('');

  list.querySelectorAll('.review-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-key');
      const cand = candidates.find(c => c.key === key);
      const startShape = cand ? cand.chain[0][1] : key.split('>')[0];
      document.getElementById('reviewListWrap').style.display = 'none';
      document.getElementById('reviewPathWrap').style.display = 'block';
      document.getElementById('reviewPathContent').dataset.key = key;
      document.getElementById('reviewPathContent').innerHTML = `<div class="trace-seq">${renderContinuation(startShape, 'image')}</div>`;
    });
  });
}

document.getElementById('reviewBackBtn').addEventListener('click', () => {
  document.getElementById('reviewPathWrap').style.display = 'none';
  document.getElementById('reviewListWrap').style.display = 'block';
});

// ---- trace tab: unique-shape picker + path-to-completion viewer ----
const shapeMoveMap = {};
const nextsMap = {};
RAW_CHAINS.forEach(([flag, chain]) => {
  chain.forEach(([mv, shape], i) => {
    shapeMoveMap[shape] = mv;
    if(!nextsMap[shape]) nextsMap[shape] = new Set();
    if(i+1 < chain.length) nextsMap[shape].add(chain[i+1][1]);
  });
});
const ALL_UNIQUE_SHAPES = Object.keys(shapeMoveMap);

function renderTraceList(){
  const list = document.getElementById('traceShapeList');
  if(ALL_UNIQUE_SHAPES.length === 0){
    list.innerHTML = '<div class="trace-empty">データがありません。</div>';
    return;
  }
  const byMoveGroup = {};
  ALL_UNIQUE_SHAPES.forEach(s => {
    const mv = shapeMoveMap[s];
    if(!byMoveGroup[mv]) byMoveGroup[mv] = [];
    byMoveGroup[mv].push(s);
  });
  const moves = Object.keys(byMoveGroup).map(Number).sort((a,b) => b-a);
  list.innerHTML = moves.map(mv => {
    const shapes = byMoveGroup[mv].sort();
    const items = shapes.map(s => {
      const visual = mode === 'text' ? '' : renderShapeIcons(s, 32);
      return `
        <button class="trace-shape-btn" data-shape="${s.replace(/"/g,'&quot;')}">
          ${visual}
          <span class="label">${shapeSlash(s)}</span>
        </button>
      `;
    }).join('');
    return `
      <div class="trace-group">
        <div class="trace-group-title">残り ${mv} 手（${shapes.length}パターン）</div>
        <div class="trace-shape-list">${items}</div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.trace-shape-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectStudyPattern(btn.getAttribute('data-shape'));
    });
  });
}

function renderContinuation(shape, forceMode){
  const effectiveMode = forceMode || mode;
  const mv = shapeMoveMap[shape];
  const isFinal = mv === 0;
  const visual = effectiveMode === 'text' ? '' : renderShapeIcons(shape, 34);
  const label = `<span class="txt">${shapeSlash(shape)}${isFinal ? '（完成）' : ''}</span>`;
  let html = `
    <div class="trace-node ${isFinal ? 'final' : ''}">
      <span class="mv">${mv}手</span>
      <span class="content">${visual}${label}</span>
    </div>
  `;
  const nexts = Array.from(nextsMap[shape] || []).filter(Boolean);
  if(nexts.length === 0) return html;
  if(nexts.length === 1){
    html += `<div class="trace-arrow-row">↓</div>`;
    html += renderContinuation(nexts[0], forceMode);
    return html;
  }
  html += `<div class="trace-arrow-row">↓ ここから${nexts.length}通りに分岐</div>`;
  html += `<div class="branch-wrap">` + nexts.map((n, i) => `
    <div class="branch-col">
      <div class="branch-label">分岐パターン ${i+1}</div>
      ${renderContinuation(n, forceMode)}
    </div>
  `).join('') + `</div>`;
  return html;
}

let selectedPattern = null; // shared across 成形経路 / チェック / スクランブル
let showingStudyList = true; // when true, the shared pattern picker is shown in whichever sub-tab is active

function renderTracePathDetail(shape){
  document.getElementById('tracePathContent').innerHTML = `<div class="trace-seq">${renderContinuation(shape, 'image')}</div>`;
  document.getElementById('tracePathContent').dataset.shape = shape;
  const masteryWrap = document.getElementById('tracePathMastery');
  masteryWrap.innerHTML = '';
  masteryWrap.appendChild(renderMasteryBadge(shape, () => renderTracePathDetail(shape)));
}

// Selecting a pattern from the shared list keeps the user on whichever
// sub-tab (成形経路/チェック/スクランブル) they were already on.
function selectStudyPattern(shape){
  selectedPattern = shape;
  showingStudyList = false;
  refreshStudyView();
}

// Central re-render for the 学習 view: shows the picker list when
// `showingStudyList` is true, otherwise the active sub-tab's detail content.
// Toggles the body-level layout that stretches the timer box to the bottom
// of the viewport, active only on the 学習｜スクランブル detail screen and
// the トレーナー｜パズル screen.
function updatePageFillMode(){
  const trainerActive = document.getElementById('view-trainer-main').classList.contains('active');
  const trainerTabBtn = document.querySelector('#trainerSubTabBar button.active');
  const puzzleActive = trainerActive && trainerTabBtn && trainerTabBtn.getAttribute('data-trainer-tab') === 'puzzle';

  const studyActive = document.getElementById('view-study').classList.contains('active');
  const studyTabBtn = document.querySelector('#studySubTabBar button.active');
  const scrambleDetailActive = studyActive && !showingStudyList && studyTabBtn && studyTabBtn.getAttribute('data-study-tab') === 'scramble';

  document.body.classList.toggle('page-fill', puzzleActive || scrambleDetailActive);
}

function refreshStudyView(){
  const activeBtn = document.querySelector('#studySubTabBar button.active');
  const tab = activeBtn ? activeBtn.getAttribute('data-study-tab') : 'path';
  document.querySelectorAll('.study-panel').forEach(p => p.classList.toggle('active', p.id === 'study-'+tab));
  document.getElementById('studySharedList').classList.toggle('hidden', !showingStudyList);

  const wraps = { path:'tracePathWrap', check:'checkContentWrap', scramble:'scrambleContentWrap' };
  Object.entries(wraps).forEach(([t, id]) => {
    const show = !showingStudyList && t === tab;
    document.getElementById(id).classList.toggle('hidden', !show);
  });

  if(!showingStudyList && selectedPattern){
    if(tab === 'path') renderTracePathDetail(selectedPattern);
    else if(tab === 'check') renderCheckDetail();
    else if(tab === 'scramble') renderStudyScrambleDetail();
  }
  updatePageFillMode();
}

document.getElementById('studyBackBtn').addEventListener('click', () => {
  showingStudyList = true;
  refreshStudyView();
});

// ---- study sub-tabs (成形経路 / チェック / スクランブル) ----
document.getElementById('studySubTabBar').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-study-tab]');
  if(!btn) return;
  document.querySelectorAll('#studySubTabBar button').forEach(b => b.classList.toggle('active', b === btn));
  refreshStudyView();
});

// ---- チェック: single-pattern quiz, reusing buildChoices/renderShapeVisual ----
let checkState = null;

function buildCheckChain(shape){
  const chain = [[shapeMoveMap[shape], shape]];
  let cur = shape;
  while(shapeMoveMap[cur] > 0){
    const nexts = Array.from(nextsMap[cur] || []).filter(Boolean);
    if(nexts.length === 0) break;
    const nxt = nexts[Math.floor(Math.random()*nexts.length)];
    chain.push([shapeMoveMap[nxt], nxt]);
    cur = nxt;
  }
  return chain;
}

function renderCheckDetail(){
  const masteryWrap = document.getElementById('checkMastery');
  masteryWrap.innerHTML = '';
  masteryWrap.appendChild(renderMasteryBadge(selectedPattern, renderCheckDetail));

  if(selectedPattern === 'Square/Square'){
    // Already solved: nothing to quiz, just show the shape itself.
    document.getElementById('checkTrack').innerHTML = '';
    document.getElementById('checkCard').innerHTML = `
      <div class="row-label">
        <span class="k">現在の形</span>
        <span class="moves-badge">残り 0 手</span>
      </div>
      <div class="current-shape-wrap">${renderShapeVisual('Square/Square', {size:52, showLabel:true, mode:'image'})}</div>
      <div class="info-step"><div class="check-complete-msg">完成形です</div></div>
    `;
    checkState = null;
    return;
  }

  checkState = {
    shape: selectedPattern,
    chain: buildCheckChain(selectedPattern),
    stepIndex: 0
  };
  renderCheckTrack();
  renderCheckStep();
}

function renderCheckTrack(){
  const track = document.getElementById('checkTrack');
  track.innerHTML = '';
  checkState.chain.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'seg';
    if(i < checkState.stepIndex) seg.classList.add('done');
    if(i === checkState.stepIndex) seg.classList.add('now');
    track.appendChild(seg);
  });
}

function isCheckFinalTarget(stepIndex){
  const after = checkState.chain[stepIndex+2];
  return !after || after[0] <= 1;
}

function showCheckCompletion(stepIndex){
  const [curMove, curShape] = checkState.chain[stepIndex+1];
  const tail = checkState.chain.slice(stepIndex+2);
  checkState.stepIndex = checkState.chain.length - 1;
  renderCheckTrack();
  const card = document.getElementById('checkCard');
  const tailHtml = tail.map((node, idx) => {
    const [, shape] = node;
    const isFinal = idx === tail.length - 1;
    const visual = renderShapeVisual(shape, {size:40, showLabel:true, mode:'image'});
    const arrow = isFinal ? '' : '<div class="tail-arrow">↓</div>';
    return `<div class="tail-node">${visual}</div>${arrow}`;
  }).join('');
  card.innerHTML = `
    <div class="row-label">
      <span class="k">現在の形</span>
      <span class="moves-badge">残り ${curMove} 手</span>
    </div>
    <div class="current-shape-wrap">${renderShapeVisual(curShape, {size:52, showLabel:true, mode:'image'})}</div>
    <div class="info-step">
      <div class="tail-chain">${tailHtml}</div>
    </div>
    <button class="next-btn" id="checkRestartBtn">もう一度チェックする</button>
  `;
  document.getElementById('checkRestartBtn').onclick = renderCheckDetail;
}

function checkGoNext(stepIndex){
  if(isCheckFinalTarget(stepIndex)){
    showCheckCompletion(stepIndex);
  } else {
    checkState.stepIndex++;
    renderCheckTrack();
    renderCheckStep();
  }
}

function renderCheckStep(){
  const card = document.getElementById('checkCard');
  const { chain, stepIndex } = checkState;
  const [curMove, curShape] = chain[stepIndex];
  const [nextMove, nextShape] = chain[stepIndex+1];

  card.innerHTML = `
    <div class="row-label">
      <span class="k">現在の形</span>
      <span class="moves-badge">残り ${curMove} 手</span>
    </div>
    <div class="current-shape-wrap">${renderShapeVisual(curShape, {size:52, showLabel:true, mode:'image'})}</div>
    <div class="prompt">次の形は？（残り ${nextMove} 手）</div>
    <div class="choices" id="checkChoicesBox"></div>
  `;

  const choices = buildChoices(curShape, nextShape, nextMove, shapeMoveMap[checkState.shape]);
  const choicesBox = document.getElementById('checkChoicesBox');
  choicesBox.innerHTML = choices.map(c => {
    const body = renderShapeVisual(c, {size:40, showLabel:false, mode:'image'});
    return `<button class="choice" data-shape="${c.replace(/"/g,'&quot;')}">${body}</button>`;
  }).join('');

  const buttons = card.querySelectorAll('.choice');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const picked = btn.getAttribute('data-shape');
      const correct = picked === nextShape;
      buttons.forEach(b => {
        b.classList.add('disabled');
        const isThisCorrect = b.getAttribute('data-shape') === nextShape;
        if(isThisCorrect) b.classList.add('correct');
        else if(b === btn) b.classList.add('wrong');
        if(isThisCorrect || b === btn){
          const label = document.createElement('div');
          label.className = 'visual-label';
          label.innerHTML = `<b>${shapeSlash(b.getAttribute('data-shape'))}</b>`;
          b.appendChild(label);
        }
      });
      if(correct){
        setTimeout(() => checkGoNext(stepIndex), 550);
      } else {
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn';
        nextBtn.textContent = '次へ進む';
        nextBtn.onclick = () => checkGoNext(stepIndex);
        card.appendChild(nextBtn);
      }
    }, { once: true });
  });
}

// ---- スクランブル (学習): pattern name + one scramble + timer ----
let studyScrambleIdx = 0;

function renderStudyScrambleDetail(){
  studyScrambleIdx = 0;
  const masteryWrap = document.getElementById('studyScrambleMastery');
  masteryWrap.innerHTML = '';
  masteryWrap.appendChild(renderMasteryBadge(selectedPattern, renderStudyScrambleDetail));
  renderStudyScrambleInfo();
}

function renderStudyScrambleInfo(){
  const scrs = SCRAMBLES[selectedPattern] || [];
  document.getElementById('studyPatternName').textContent = selectedPattern;
  document.getElementById('studyScrambleText').textContent = scrs.length ? scrs[studyScrambleIdx] : 'スクランブルなし（完成形）';
  const switchBtn = document.getElementById('studyScrambleSwitch');
  if(scrs.length > 1){
    switchBtn.style.display = 'inline-block';
    switchBtn.textContent = `他のスクランブルを見る（${studyScrambleIdx+1}/${scrs.length}）`;
  } else {
    switchBtn.style.display = 'none';
  }
}

function studyScrambleCycle(){
  const scrs = SCRAMBLES[selectedPattern] || [];
  if(scrs.length <= 1) return;
  studyScrambleIdx = (studyScrambleIdx + 1) % scrs.length;
  renderStudyScrambleInfo();
}

document.getElementById('studyScrambleSwitch').addEventListener('click', studyScrambleCycle);

// ---- トレーナー｜パズル: random pattern from the shared filters + timer ----
function puzzlePool(){
  return ALL_UNIQUE_SHAPES.filter(s => shapeMoveMap[s] >= 3 && selectedMoves.has(shapeMoveMap[s]) && matchesStatus(s));
}
let puzzleCurrentShape = null;
let puzzleScrambleIdx = 0;

function puzzleAdvance(){
  const pool = puzzlePool();
  const emptyWrap = document.getElementById('puzzleEmptyWrap');
  const contentWrap = document.getElementById('puzzleContentWrap');
  if(pool.length === 0){
    puzzleCurrentShape = null;
    emptyWrap.classList.remove('hidden');
    contentWrap.classList.add('hidden');
    return;
  }
  emptyWrap.classList.add('hidden');
  contentWrap.classList.remove('hidden');
  // Avoid picking the same pattern twice in a row (a different scramble for
  // the same pattern still counts as "the same"), unless it's the only one
  // available under the current filters.
  let candidatesPool = pool;
  if(pool.length > 1 && puzzleCurrentShape){
    const filtered = pool.filter(s => s !== puzzleCurrentShape);
    if(filtered.length > 0) candidatesPool = filtered;
  }
  puzzleCurrentShape = candidatesPool[Math.floor(Math.random()*candidatesPool.length)];
  const scrs = SCRAMBLES[puzzleCurrentShape] || [];
  puzzleScrambleIdx = scrs.length ? Math.floor(Math.random()*scrs.length) : 0;
  document.getElementById('puzzlePatternName').textContent = puzzleCurrentShape;
  document.getElementById('puzzleScrambleText').textContent = scrs.length ? scrs[puzzleScrambleIdx] : 'スクランブルなし';
}

// ---- timer widget (shared behavior for 学習｜スクランブル and トレーナー｜パズル) ----
// Long-press >=500ms to arm (green light); release while armed starts the
// stopwatch; a tap while running stops it and calls onAdvance(). The frozen
// time stays on screen (per spec) until the next successful long-press.
function createTimerController(prefix, onAdvance, isActiveFn){
  const el = document.getElementById(prefix+'TimerBtn');
  const disp = document.getElementById(prefix+'TimerDisplay');
  const hint = document.getElementById(prefix+'TimerHint');
  const state = { phase:'idle', holdTimeout:null, startTime:0, raf:null };

  function fmt(ms){ return (ms/1000).toFixed(2); }
  function tick(){
    if(state.phase !== 'running') return;
    disp.textContent = fmt(performance.now() - state.startTime);
    state.raf = requestAnimationFrame(tick);
  }
  function down(ev){
    ev.preventDefault();
    if(state.phase === 'running'){
      state.phase = 'stopped';
      if(state.raf) cancelAnimationFrame(state.raf);
      el.classList.remove('running');
      disp.textContent = fmt(performance.now() - state.startTime);
      hint.textContent = '長押ししてスタート';
      if(onAdvance) onAdvance();
      return;
    }
    if(state.phase === 'idle' || state.phase === 'stopped'){
      state.phase = 'pressing';
      state.holdTimeout = setTimeout(() => {
        if(state.phase === 'pressing'){
          state.phase = 'armed';
          el.classList.add('green');
          hint.textContent = '離してスタート';
        }
      }, 500);
    }
  }
  function up(ev){
    if(state.phase === 'pressing'){
      clearTimeout(state.holdTimeout);
      state.phase = 'idle';
      hint.textContent = '長押ししてスタート';
    } else if(state.phase === 'armed'){
      clearTimeout(state.holdTimeout);
      state.phase = 'running';
      el.classList.remove('green');
      el.classList.add('running');
      state.startTime = performance.now();
      disp.textContent = '0.00';
      hint.textContent = 'タップでストップ';
      tick();
    }
  }
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);

  // Keyboard equivalent: Space acts exactly like a tap/long-press, but only
  // while this widget's screen is actually the one being shown.
  document.addEventListener('keydown', (ev) => {
    if(ev.code !== 'Space' && ev.key !== ' ') return;
    if(isActiveFn && !isActiveFn()) return;
    ev.preventDefault();
    if(ev.repeat) return; // ignore OS key-repeat; down() already no-ops mid-press anyway
    down(ev);
  });
  document.addEventListener('keyup', (ev) => {
    if(ev.code !== 'Space' && ev.key !== ' ') return;
    if(isActiveFn && !isActiveFn()) return;
    ev.preventDefault();
    up(ev);
  });
  return state;
}

let studyTimer = null;
let puzzleTimer = null;

// ---- main tabs (学習 / トレーナー) ----
document.getElementById('mainTabBar').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-main-tab]');
  if(!btn) return;
  const tab = btn.getAttribute('data-main-tab');
  document.querySelectorAll('#mainTabBar button').forEach(b => b.classList.toggle('active', b === btn));
  document.getElementById('view-study').classList.toggle('active', tab === 'study');
  document.getElementById('view-trainer-main').classList.toggle('active', tab === 'trainer');
  if(tab === 'trainer' && document.getElementById('trainer-puzzle').classList.contains('active') && !puzzleCurrentShape){
    puzzleAdvance();
  }
  updatePageFillMode();
});

// ---- trainer sub-tabs (アプリ / パズル) ----
document.getElementById('trainerSubTabBar').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-trainer-tab]');
  if(!btn) return;
  const tab = btn.getAttribute('data-trainer-tab');
  document.querySelectorAll('#trainerSubTabBar button').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.trainer-panel').forEach(p => p.classList.toggle('active', p.id === 'trainer-'+tab));
  if(tab === 'puzzle' && !puzzleCurrentShape) puzzleAdvance();
  updatePageFillMode();
});

document.getElementById('toggleWeak').addEventListener('click', () => {
  const panel = document.getElementById('weakPanel');
  const opening = !panel.classList.contains('open');
  panel.classList.toggle('open');
  if(opening){
    document.getElementById('reviewPathWrap').style.display = 'none';
    document.getElementById('reviewListWrap').style.display = 'block';
    renderWeakList();
  }
});

document.getElementById('resetStats').addEventListener('click', async () => {
  if(!confirm('記録をすべてリセットしますか？')) return;
  missedKeys = new Set();
  await saveMissed();
  renderWeakList();
});

document.getElementById('maxMovesToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mm]');
  if(!btn) return;
  const mm = parseInt(btn.getAttribute('data-mm'), 10);
  if(selectedMoves.has(mm)){
    if(selectedMoves.size === 1) return; // always keep at least one selected
    selectedMoves.delete(mm);
  } else {
    selectedMoves.add(mm);
  }
  syncMaxMovesButtons();
  saveSelectedMoves();
  rebuildCandidates();
  pickChain();
  puzzleAdvance();
});

document.getElementById('statusToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-status]');
  if(!btn) return;
  const st = btn.getAttribute('data-status');
  if(st === statusFilter) return;
  statusFilter = st;
  syncStatusButtons();
  saveStatusFilter();
  rebuildCandidates();
  pickChain();
  puzzleAdvance();
});

Promise.all([loadSelectedMoves(), loadMissed(), loadMastery(), loadStatusFilter()]).then(() => {
  rebuildCandidates();
  pickChain();
  renderTraceList();
  refreshStudyView();
  studyTimer = createTimerController('study', studyScrambleCycle, () =>
    document.getElementById('view-study').classList.contains('active') &&
    !showingStudyList &&
    document.querySelector('#studySubTabBar button.active').getAttribute('data-study-tab') === 'scramble'
  );
  puzzleTimer = createTimerController('puzzle', puzzleAdvance, () =>
    document.getElementById('view-trainer-main').classList.contains('active') &&
    document.querySelector('#trainerSubTabBar button.active').getAttribute('data-trainer-tab') === 'puzzle'
  );
});
</script>
